name: Update Catalog

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Catalog Scraper
        run: npm run update:catalog
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/models.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'data: update model catalog from official sources'
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: data-update-catalog
          delete-branch: true
          title: '🔄 Automated Catalog Update'
          body: |
            Automated update of the model catalog from official sources.
            
            Please review the changes in `src/data/models.json` before merging.
            This PR was generated by the periodic scraping workflow.
          labels: |
            data
            automated-update
          draft: false
